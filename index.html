    cursor: pointer;

  #pm-hamburger span { width: 18px; height: 2px; background: #4A3F3A; border-radius: 2px; }

  #pm-overlay {
    position: fixed; inset: 0; background: rgba(36,30,28,0.35);
    z-index: 1998; opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  #pm-overlay.show { opacity: 1; pointer-events: auto; }

        var pmParkingLayer = L.layerGroup();
        (function pmBuildIndicatorMarkers() {
            var stopIcon = L.divIcon({ className: '', html: '<div class="pm-stop-marker"></div>', iconSize: [14, 12], iconAnchor: [7, 12] });
            var parkingIcon = L.divIcon({ className: '', html: '<div class="pm-parking-marker"></div>', iconSize: [12, 12], iconAnchor: [6, 6] });

            // group monuments sharing the exact same stop / parking coordinate
            var stopGroups = {};
            var parkingGroups = {};
            json_pametnici__1.features.forEach(function(feat) {
                var p = feat.properties;
                if (p.stop_lat && p.stop_lon) {
                    var key = p.stop_lat + ',' + p.stop_lon;
                    if (!stopGroups[key]) stopGroups[key] = { lat: p.stop_lat, lon: p.stop_lon, label: p.nearest_stop, fids: [] };
                    stopGroups[key].fids.push(p.fid);
                }
                if (p.parking_lat && p.parking_lon) {
                    var key2 = p.parking_lat + ',' + p.parking_lon;
                    if (!parkingGroups[key2]) parkingGroups[key2] = { lat: p.parking_lat, lon: p.parking_lon, label: p.parking_desc, fids: [] };
                    parkingGroups[key2].fids.push(p.fid);
                }
            });

            Object.keys(stopGroups).forEach(function(key) {
                var g = stopGroups[key];
                var m = L.marker([g.lat, g.lon], { icon: stopIcon, interactive: true });
                var fidsLabel = g.fids.length > 1 ? 'за №' + g.fids.join(', №') : 'за №' + g.fids[0];
                m.bindTooltip('🚌 ' + (g.label || '') + ' — ' + fidsLabel, { className: 'pm-indicator-tooltip' });
                pmStopLayer.addLayer(m);
            });
            Object.keys(parkingGroups).forEach(function(key) {
                var g = parkingGroups[key];
                var pm2 = L.marker([g.lat, g.lon], { icon: parkingIcon, interactive: true });
                var fidsLabel = g.fids.length > 1 ? 'за №' + g.fids.join(', №') : 'за №' + g.fids[0];
                pm2.bindTooltip('🅿️ ' + (g.label || '') + ' — ' + fidsLabel, { className: 'pm-indicator-tooltip' });
                pmParkingLayer.addLayer(pm2);
            });
        })();

        (function pmBuildSidebar() {
            // collect the actual leaflet layers in the same order as json_pametnici__1.features
            var leafletLayers = [];
            layer_pametnici__1.eachLayer(function(lyr) { leafletLayers.push(lyr); });

            var listEl = document.getElementById('pm-list');
            var searchEl = document.getElementById('pm-search');
            var legendEl = document.getElementById('pm-legend');
            var items = json_pametnici__1.features.map(function(feat, i) {
                return { feat: feat, lyr: leafletLayers[i], dotEl: null };
            });

            function render(filter) {
                if (pmCurrentMode === 'routes') { renderRoutes(); return; }
                var q = (filter || '').trim().toLowerCase();
                listEl.innerHTML = '';
                items.forEach(function(it) {
                    var p = it.feat.properties;
                    if (q && !((p.name || '').toLowerCase().includes(q) || (p.address || '').toLowerCase().includes(q))) return;
                    var row = document.createElement('div');
                    row.className = 'pm-item';
                    var color = pmColorFor(pmCurrentMode, p);
                    row.innerHTML = '<span class="pm-item-dot" style="background:' + color + '"></span>' +
                        '<span><span class="pm-item-name">' + (p.name || '') + '</span><br>' +
                        '<span class="pm-item-addr">' + (p.address || '') + '</span></span>';
                    it.dotEl = row.querySelector('.pm-item-dot');
                    row.addEventListener('click', function() {
                        var latlng = it.lyr.getLatLng();
                        map.setView(latlng, Math.max(map.getZoom(), 16));
                        it.lyr.openPopup();
                        pmToggleSidebar(false);
                    });
                    listEl.appendChild(row);
                });
            }

            var fidToItem = {};
            items.forEach(function(it) { fidToItem[it.feat.properties.fid] = it; });
            var pmRouteLayer = L.layerGroup().addTo(map);
            var activeRouteIdx = null;

            function clearRoute() {
                pmRouteLayer.clearLayers();
                activeRouteIdx = null;
                var stepsEl = document.getElementById('pm-route-steps');
                if (stepsEl) stepsEl.innerHTML = '';
                var clearBtn = document.getElementById('pm-route-clear');
                if (clearBtn) clearBtn.style.display = 'none';
            }

            function drawRoute(idx) {
                clearRoute();
                activeRouteIdx = idx;
                var route = ROUTES[idx];
                var latlngs = [L.latLng(CENTRAL_STATION[0], CENTRAL_STATION[1])];
                var stepsHtml = '<div style="margin-bottom:4px;">🚉 <b>Старт: Централна гара</b></div>';
                var stationIcon = L.divIcon({
                    className: '', iconSize: [26, 26], iconAnchor: [13, 13],
                    html: '<div style="width:26px;height:26px;border-radius:50%;background:#F0A98A;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.3);">🚉</div>'
                });
                L.marker(CENTRAL_STATION, { icon: stationIcon, interactive: false }).addTo(pmRouteLayer);
                route.fids.forEach(function(fid, i) {
                    var it = fidToItem[fid];
                    if (!it) return;
                    var ll = it.lyr.getLatLng();
                    latlngs.push(ll);
                    stepsHtml += '<div>' + (i + 1) + '. <b>№' + fid + '</b> ' + it.feat.properties.name + '</div>';
                    var numIcon = L.divIcon({
                        className: '', iconSize: [20, 20], iconAnchor: [10, 10],
                        html: '<div style="width:20px;height:20px;border-radius:50%;background:#4A3F3A;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.3);">' + (i + 1) + '</div>'
                    });
                    L.marker(ll, { icon: numIcon, interactive: false }).addTo(pmRouteLayer);
                });
                if (latlngs.length > 1) {
                    L.polyline(latlngs, { color: '#051230', weight: 4, opacity: 0.9, lineCap: 'round' }).addTo(pmRouteLayer);
                }
                if (latlngs.length) {
                    map.fitBounds(L.latLngBounds(latlngs), { padding: [60, 60] });
                }
                document.getElementById('pm-route-steps').innerHTML = stepsHtml;
                document.getElementById('pm-route-clear').style.display = 'block';
                document.querySelectorAll('.pm-route-item').forEach(function(el, i) {
                    el.classList.toggle('active', i === idx);
                });
            }

            function renderRoutes() {
                listEl.innerHTML = '';
                ROUTES.forEach(function(route, idx) {
                    var row = document.createElement('div');
                    row.className = 'pm-route-item';
                    row.innerHTML = '<div class="pm-route-title">' + route.title + '</div>' +
                        '<div class="pm-route-count">' + route.fids.length + ' паметника</div>';
                    row.addEventListener('click', function() { drawRoute(idx); });
                    listEl.appendChild(row);
                });
                var stepsWrap = document.createElement('div');
                stepsWrap.id = 'pm-route-steps';
                listEl.appendChild(stepsWrap);
                var clearBtn = document.createElement('button');
                clearBtn.id = 'pm-route-clear';
                clearBtn.textContent = 'Изчисти маршрута от картата';
                clearBtn.addEventListener('click', clearRoute);
                listEl.appendChild(clearBtn);
                if (activeRouteIdx !== null) drawRoute(activeRouteIdx);
            }

            function applyMode(mode) {
                pmCurrentMode = mode;
                document.querySelectorAll('.pm-cat-btn').forEach(function(btn) {
                    btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
                });
                items.forEach(function(it) {
                    var color = pmColorFor(mode, it.feat.properties);
                    it.lyr.setStyle({ fillColor: color });
                });
                legendEl.innerHTML = (LEGENDS[mode] || []).map(function(r) {
                    return '<span class="pm-lg-row"><span class="pm-lg-dot" style="background:' + r[1] + '"></span>' + r[0] + '</span>';
                }).join('');
                var statusNames = {
                    none: 'Обикновена карта',
                    transport: 'Режим: достъпност с обществен транспорт',
                    car: 'Режим: достъпност с личен транспорт',
                    era: 'Режим: епоха на създаване',
                    routes: 'Режим: тематични маршрути'
                };
                document.getElementById('pm-statusbadge-text').textContent = statusNames[mode] || 'Обикновена карта';
                if (mode !== 'routes') clearRoute();
                searchEl.style.display = (mode === 'routes') ? 'none' : 'block';
                if (map.hasLayer(pmStopLayer)) map.removeLayer(pmStopLayer);
                if (map.hasLayer(pmParkingLayer)) map.removeLayer(pmParkingLayer);
                if (mode === 'transport') map.addLayer(pmStopLayer);
                if (mode === 'car') map.addLayer(pmParkingLayer);
                var listSection = document.getElementById('pm-list-section');
                if (mode === 'none') {
                    listSection.classList.remove('show');
                } else {
                    listSection.classList.add('show');
                }
                render(searchEl.value);
            }

            document.querySelectorAll('.pm-cat-btn').forEach(function(btn) {
                btn.addEventListener('click', function() { applyMode(btn.getAttribute('data-mode')); });
            });
            document.getElementById('pm-mode-reset').addEventListener('click', function() { applyMode('none'); });

            searchEl.addEventListener('input', function() { render(searchEl.value); });
            applyMode('none');
        })();
        </script>
    </body>
</html>
